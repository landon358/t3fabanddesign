<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
</helmet>
<header style="position:sticky;top:0;z-index:60;font-family:'IBM Plex Sans',system-ui,sans-serif">
  <div style="background:#16191C;color:#9AA2AA">
    <div style="max-width:1180px;margin:0 auto;padding:7px 20px;display:flex;flex-wrap:wrap;gap:4px 22px;align-items:center;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase">
      <div style="display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center">
        <span>1255 Leonard St NW &middot; Grand Rapids, MI</span>
        <span style="color:#E8713C">Open weekends</span>
      </div>
      <a href="tel:+16165898594" style="color:#E7E9EA;text-decoration:none;letter-spacing:.09em">(616) 589-8594</a>
    </div>
  </div>
  <div style="background:#E7E9EA;border-bottom:2px solid #16191C">
    <div style="max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between">
      <a href="Home.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#16191C;min-width:0">
        <span style="width:36px;height:36px;flex:none;background:#BF4A18;color:#E7E9EA;display:flex;align-items:center;justify-content:center;font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:22px;letter-spacing:-.02em">T3</span>
        <span style="display:flex;flex-direction:column;line-height:1;min-width:0">
          <span style="font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:clamp(18px,4.4vw,22px);text-transform:uppercase">Design &amp; Fab</span>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:#6C747C;margin-top:4px">Welding &middot; Fabrication &middot; Design</span>
        </span>
      </a>
      <nav style="{{ deskNavStyle }}">
        <sc-for list="{{ links }}" as="link" hint-placeholder-count="7">
          <a href="{{ link.href }}" style="{{ link.style }}" style-hover="color:#BF4A18">{{ link.label }}</a>
        </sc-for>
        <a href="sms:+16165898594" style="background:#BF4A18;color:#E7E9EA;text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;padding:10px 16px" style-hover="background:#16191C">Text a photo</a>
      </nav>
      <button type="button" onClick="{{ toggle }}" aria-label="Menu" aria-expanded="{{ open }}" style="{{ burgerStyle }}">
        <span style="display:flex;flex-direction:column;gap:4px;width:18px">
          <span style="height:2px;background:#16191C;display:block"></span>
          <span style="height:2px;background:#16191C;display:block"></span>
          <span style="height:2px;background:#16191C;display:block"></span>
        </span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#16191C">{{ burgerLabel }}</span>
      </button>
    </div>
    <div style="{{ panelStyle }}">
      <div style="max-width:1180px;margin:0 auto;padding:4px 20px 18px;display:flex;flex-direction:column">
        <sc-for list="{{ mobileLinks }}" as="link" hint-placeholder-count="7">
          <a href="{{ link.href }}" style="{{ link.mStyle }}">{{ link.label }}</a>
        </sc-for>
        <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
          <a href="tel:+16165898594" style="flex:1 1 150px;text-align:center;background:#16191C;color:#E7E9EA;text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:15px 14px">Call</a>
          <a href="sms:+16165898594" style="flex:1 1 150px;text-align:center;background:#BF4A18;color:#E7E9EA;text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:15px 14px">Text a photo</a>
        </div>
      </div>
    </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:140},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false, mobile: false };

  componentDidMount() {
    this.sync = () => {
      const m = window.innerWidth < 900;
      if (m !== this.state.mobile) this.setState({ mobile: m, open: false });
    };
    this.sync();
    window.addEventListener("resize", this.sync);
  }
  componentWillUnmount() { window.removeEventListener("resize", this.sync); }

  renderVals() {
    const pages = [
      ["Wheel Repair", "Wheel-Repair.dc.html"],
      ["Aluminum Welding", "Aluminum-Welding.dc.html"],
      ["Rust Repair", "Rust-Repair.dc.html"],
      ["Custom Fab", "Custom-Fabrication.dc.html"],
      ["Design", "Design-Prototyping.dc.html"],
      ["About", "About.dc.html"],
      ["Contact", "Contact.dc.html"],
    ];
    const active = this.props.active || "";
    const { mobile, open } = this.state;
    const links = pages.map(([label, href]) => {
      const on = label === active;
      return {
        label, href,
        style: "text-decoration:none;font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;font-weight:500;letter-spacing:.02em;text-transform:uppercase;padding:6px 0;border-bottom:2px solid " +
          (on ? "#BF4A18" : "transparent") + ";color:" + (on ? "#16191C" : "#2B3137"),
        mStyle: "text-decoration:none;font-family:'Saira Condensed',sans-serif;font-size:21px;font-weight:600;text-transform:uppercase;letter-spacing:.01em;padding:13px 0;border-bottom:1px solid #C4C9CD;color:" +
          (on ? "#BF4A18" : "#16191C"),
      };
    });
    return {
      links, mobileLinks: links, open,
      toggle: () => this.setState((s) => ({ open: !s.open })),
      burgerLabel: open ? "Close" : "Menu",
      deskNavStyle: "display:" + (mobile ? "none" : "flex") + ";flex-wrap:wrap;align-items:center;gap:4px 20px",
      burgerStyle: "display:" + (mobile ? "flex" : "none") + ";align-items:center;gap:10px;background:transparent;border:1px solid #16191C;padding:11px 14px;cursor:pointer;min-height:44px",
      panelStyle: "display:" + (mobile && open ? "block" : "none") + ";background:#E7E9EA;border-top:1px solid #C4C9CD",
    };
  }
}
</script>
</body>
</html>
